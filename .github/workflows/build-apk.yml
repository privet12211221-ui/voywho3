name: Build APK

on:
  push:
    branches:
      - "claude/android-basic-calculator-ozuefa"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK to repo
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/calculator-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/calculator-debug.apk
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add built debug APK [skip ci]"
            git push
          fi
